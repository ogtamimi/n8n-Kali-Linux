services:
  n8n-kali:
    build:
      context: .
      dockerfile: dockerfile
      args:
        N8N_VERSION: ${N8N_VERSION:-latest}
    container_name: n8n-kali
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_USER_FOLDER: /home/node
      N8N_PORT: 5678
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-in-.env}
    volumes:
      - ./n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
